<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241332">
  <title>Arcardia – Spieler &amp; Berufe</title>
</head>
<body>
  <p id="status">Arcardia wird geladen …</p>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const response = await fetch('./Index.html?restore-first-design=1', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Laden fehlgeschlagen (${response.status})`);
        let html = await response.text();

        // Restore the original first-pass shield, upward rune and lantern emblem.
        const originalCrest = `<svg class="crest" viewBox="0 0 120 120" role="img" aria-label="Arcardia Wappen">
          <defs><linearGradient id="shield" x2="0" y2="1"><stop stop-color="var(--crest1)"/><stop offset=".5" stop-color="var(--crest2)"/><stop offset="1" stop-color="var(--crest3)"/></linearGradient></defs>
          <path d="M60 8 98 18v38c0 26-16 44-38 54C38 100 22 82 22 56V18z" fill="url(#shield)" stroke="var(--ink)" stroke-width="3"/>
          <path d="m39 45 21-19 21 19-13-5-8 5-8-5zm7 10 14-11 14 11-3 21-11 9-11-9z" fill="var(--crestAccent)" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="60" cy="41" r="5" fill="var(--ink)"/>
        </svg>`;
        html = html.replace(/<svg\b[^>]*class=["'][^"']*\bcrest\b[^"']*["'][\s\S]*?<\/svg>/i, originalCrest);

        // Keep summer out of the falling seasonal set; it will use the floating sparkles.
        html = html.replace(/((?:const\s+)?(?:seasons|seasonal)\s*=\s*)\[([^\]]*)\]/g, (whole, prefix, values) => {
          const kept = values.split(',').map(value => value.trim()).filter(value => value.replace(/[\"']/g, '') !== 'summer');
          return prefix + '[' + kept.join(',') + ']';
        });

        // Dragonfire stays in warm amber/orange colors rather than turquoise.
        html = html.replace('</style>', 'body[data-theme="dragon"]{--crestAccent:#ffb347;--spark2:#ffb347}\n</style>');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        status.textContent = 'Die Seite konnte nicht geladen werden. Bitte versuche es später erneut.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
