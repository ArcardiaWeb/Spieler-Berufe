<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d35">
  <title>Arcardia – Spieler &amp; Berufe</title>
</head>
<body>
  <p id="status">Arcardia wird geladen …</p>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const response = await fetch('./Index.html', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Laden fehlgeschlagen (${response.status})`);
        let html = await response.text();
        const redesign = `
          <style id="arcadia-night-sky">
            /* Night-sky theme for every design except Winter, Herbst and Frühling. */
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) {
              --paper:#f5f2ff; --ink:#272342; --gold:#a995ff; --gold-dark:#6957b5;
              --forest:#5264a4; --moss:#8374db; --panel:rgba(248,247,255,.97);
              --shadow:rgba(10,7,40,.34); --spark:#fff5c7; --spark2:#9deaff;
              color:#f5f2ff;
              background:radial-gradient(ellipse at 50% 24%,rgba(97,66,199,.36),transparent 48%),linear-gradient(180deg,#171044 0%,#100d35 50%,#090a24 100%);
              background-attachment:fixed;
            }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"])::before {
              background:radial-gradient(circle,rgba(255,255,255,.82) 0 1px,transparent 1.8px),radial-gradient(circle,rgba(160,194,255,.7) 0 1px,transparent 2px);
              background-size:83px 97px,137px 151px; opacity:.34;
            }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) header {
              padding-top:48px; border-bottom:2px solid #9c8bff;
              background:radial-gradient(ellipse at 50% 14%,rgba(115,86,220,.3),transparent 68%);
              box-shadow:none;
            }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .design-picker {
              border:1px solid rgba(112,91,190,.18); border-radius:14px;
              background:rgba(250,249,255,.96); color:#272342;
              box-shadow:0 8px 26px rgba(0,0,0,.24); backdrop-filter:blur(8px);
            }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .design-picker label { color:#272342; }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .design-picker select {
              color:#272342; background:#fff; border:1px solid rgba(39,35,66,.15);
            }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .crest {
              filter:drop-shadow(0 0 18px rgba(157,133,255,.55)) drop-shadow(0 8px 16px rgba(0,0,0,.3));
            }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) h1 {
              text-transform:none; letter-spacing:.02em; color:#fbf9ff;
              text-shadow:0 0 28px rgba(170,148,255,.48),0 4px 18px rgba(0,0,0,.35);
            }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) header p { color:#e7e2ff; }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .tabs {
              border-bottom-color:#9181fa;
            }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .tabs button {
              border-color:rgba(190,179,255,.78); background:rgba(255,255,255,.1);
              color:#f7f4ff; box-shadow:0 7px 22px rgba(0,0,0,.22);
            }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .tabs button[aria-selected="true"] {
              color:#292443; background:#f7f5ff;
            }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) h2 { color:#f8f6ff; text-shadow:0 2px 16px rgba(0,0,0,.28); }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) input,
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) main select {
              border:1px solid rgba(255,255,255,.78); border-radius:14px;
              background:rgba(250,249,255,.97); color:#292443;
              box-shadow:0 8px 24px rgba(0,0,0,.22);
            }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .card,
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .region {
              border:1px solid rgba(255,255,255,.86); border-radius:17px;
              background:rgba(250,249,255,.97); color:#292443;
              box-shadow:0 10px 28px rgba(0,0,0,.27),0 0 12px rgba(127,105,234,.12);
            }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .player-card { color:#292443; }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .player-card h3,
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .job-card h3 { color:#292443; }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .player-job,
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .job-count { color:#5264a4; }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .player-title { color:#6957b5; }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .skin-head,
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .members img { border-color:#a995ff; }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .empty { color:#f5f2ff; }
            body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) footer { color:#e7e2ff; }
            @media (max-width:520px) {
              body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) header { padding-top:68px; }
              body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) .design-picker { top:8px; right:8px; }
            }
            @media (prefers-reduced-motion:reduce) {
              body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) *,
              body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) *::before,
              body:not([data-theme="winter"]):not([data-theme="autumn"]):not([data-theme="spring"]) *::after {
                scroll-behavior:auto !important; animation-duration:.01ms !important;
                animation-iteration-count:1 !important; transition-duration:.01ms !important;
              }
            }
          </style>`;
        html = html.replace('</head>', redesign + '\n</head>');
        html = html.replace('<h1>Spieler+Berufe</h1>', '<h1>Arcadia</h1>');
        html = html.replace('<p>von ArcardiaWeb • Mittelalterliches Rollenspiel</p>', '<p>Die Bewohner, ihre Berufe und freie Plätze</p>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        status.textContent = 'Die Seite konnte nicht geladen werden. Bitte versuche es später erneut.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
