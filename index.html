<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241332">
  <title>Arcardia – Spieler &amp; Berufe</title>
</head>
<body>
  <p id="status">Arcardia wird geladen …</p>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const response = await fetch('./Index.html', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Laden fehlgeschlagen (${response.status})`);
        let html = await response.text();

        // Replace only the crest: its colors inherit the selected design's existing theme variables.
        const logo = `<svg class="crest" viewBox="0 0 128 128" role="img" aria-label="Arcardia – Sternenwappen">
          <defs>
            <linearGradient id="arcadia-shield" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="var(--crest1)"/><stop offset=".52" stop-color="var(--crest2)"/><stop offset="1" stop-color="var(--crest3)"/>
            </linearGradient>
            <linearGradient id="arcadia-core" x1="0" y1="0" x2="0" y2="1">
              <stop stop-color="var(--crestAccent)"/><stop offset="1" stop-color="var(--crest2)"/>
            </linearGradient>
            <filter id="arcadia-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <path d="M64 5 75 13 96 10 101 29 118 42 109 60 112 82 92 90 80 111 64 105 48 111 36 90 16 82 19 60 10 42 27 29 32 10 53 13Z" fill="none" stroke="var(--crest2)" stroke-width="2" opacity=".8"/>
          <path d="M64 14 99 25v30c0 25-15 43-35 57C44 98 29 80 29 55V25z" fill="url(#arcadia-shield)" stroke="var(--crest1)" stroke-width="3"/>
          <path d="M64 22 91 31v24c0 19-11 34-27 46C48 89 37 74 37 55V31z" fill="none" stroke="var(--crest3)" stroke-width="2"/>
          <path d="m64 32 7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z" fill="url(#arcadia-core)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" filter="url(#arcadia-glow)"/>
          <path d="M64 52v34m-10-13 10 8 10-8" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="64" cy="52" r="4" fill="var(--crest1)" stroke="var(--ink)" stroke-width="1.5"/>
          <path d="m13 19 3 7 7 3-7 3-3 7-3-7-7-3 7-3zM111 94l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="var(--spark)" filter="url(#arcadia-glow)"/>
        </svg>`;
        html = html.replace(/<svg\b[^>]*class=["'][^"']*\bcrest\b[^"']*["'][\s\S]*?<\/svg>/i, logo);

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        status.textContent = 'Die Seite konnte nicht geladen werden. Bitte versuche es später erneut.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
