<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241332">
  <title>Arcardia – Spieler &amp; Berufe</title>
</head>
<body>
  <p id="status">Arcardia wird geladen …</p>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const response = await fetch('./Index.html?v=crest-fix-2', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Laden fehlgeschlagen (${response.status})`);
        let html = await response.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');

        // Restore the shield, upward arrow and lantern crest from the original design.
        const crest = doc.querySelector('svg.crest');
        if (crest) {
          crest.outerHTML = `<svg class="crest" viewBox="0 0 120 120" role="img" aria-label="Arcardia Wappen">
            <defs><linearGradient id="crestShield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--crest1)"/><stop offset=".5" stop-color="var(--crest2)"/><stop offset="1" stop-color="var(--crest3)"/></linearGradient></defs>
            <path d="M60 8 98 18v38c0 26-16 44-38 54C38 100 22 82 22 56V18z" fill="url(#crestShield)" stroke="var(--ink)" stroke-width="3"/>
            <path d="M60 16 91 24v32c0 21-13 36-31 45C42 92 29 77 29 56V24z" fill="var(--panel)" stroke="var(--crest3)" stroke-width="2"/>
            <path d="m39 47 21-20 21 20-13-6-8 5-8-5zM44 59l16-14 16 14-10-4-6-5-6 5z" fill="var(--crestAccent)"/>
            <path d="M57 56h6v32l-3 7-3-7z" fill="var(--ink)"/>
            <path d="m48 73 12-7 12 7v17l-12 9-12-9z" fill="var(--crestAccent)" stroke="var(--ink)" stroke-width="2"/>
            <path d="M60 68v30M49 78l11 6 11-6" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
            <path d="m54 78 6-4 6 4v9l-6 4-6-4z" fill="var(--crest1)" stroke="var(--ink)" stroke-width="1.5"/>
          </svg>`;
        }

        // Keep summer in the floating sparkle group, not the falling seasonal group.
        for (const script of doc.querySelectorAll('script')) {
          if (!script.textContent.includes('seasonal')) continue;
          script.textContent = script.textContent.replace(/const\s+seasonal\s*=\s*\[[^\]]*\]/, "const seasonal = ['winter','autumn','spring']");
          script.textContent = script.textContent.replace(/const\s+seasons\s*=\s*\[[^\]]*\]/, "const seasons = ['winter','autumn','spring']");
        }

        // Serialize the patched page so all of its original layout and functionality stay intact.
        document.open();
        document.write('<!DOCTYPE html>\n' + doc.documentElement.outerHTML);
        document.close();
      } catch (error) {
        status.textContent = 'Die Seite konnte nicht geladen werden. Bitte versuche es später erneut.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
