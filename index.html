<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241332">
  <title>Arcardia – Spieler &amp; Berufe</title>
</head>
<body>
  <p id="status">Arcardia wird geladen …</p>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const response = await fetch('./Index.html?v=crest-float-fix-3', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Laden fehlgeschlagen (${response.status})`);
        let html = await response.text();

        // The image reference shows a compact heraldic shield with an upward mark and lantern.
        const referenceCrest = `<svg class="crest" viewBox="0 0 120 120" role="img" aria-label="Arcardia Wappen">
          <defs>
            <linearGradient id="arcadiaShield" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--crest1)"/>
              <stop offset=".55" stop-color="var(--crest2)"/>
              <stop offset="1" stop-color="var(--crest3)"/>
            </linearGradient>
            <linearGradient id="arcadiaGlow" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--paper)"/>
              <stop offset="1" stop-color="var(--crest2)"/>
            </linearGradient>
          </defs>
          <path d="M60 7 101 18v39c0 27-17 45-41 56C36 102 19 84 19 57V18z" fill="url(#arcadiaShield)" stroke="var(--crest3)" stroke-width="3"/>
          <path d="M60 16 92 25v32c0 21-13 36-32 46C41 93 28 78 28 57V25z" fill="var(--paper)" stroke="var(--paper)" stroke-width="2"/>
          <path d="m37 49 23-22 23 22-15-6-8-7-8 7z" fill="var(--crestAccent)"/>
          <path d="m43 61 17-15 17 15-11-4-6-6-6 6z" fill="var(--crestAccent)"/>
          <path d="M57 57h6v30l-3 8-3-8z" fill="var(--ink)"/>
          <path d="m47 75 13-8 13 8v17l-13 9-13-9z" fill="url(#arcadiaGlow)" stroke="var(--crestAccent)" stroke-width="3"/>
          <path d="M60 70v29M48 79l12 7 12-7" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="m54 79 6-4 6 4v9l-6 4-6-4z" fill="var(--crest2)" stroke="var(--ink)" stroke-width="1.5"/>
          <circle cx="60" cy="42" r="3.5" fill="var(--ink)"/>
        </svg>`;
        html = html.replace(/<svg class="crest"[\s\S]*?<\/svg>/, referenceCrest);

        // Summer uses the same floating sparkle motion as the non-seasonal designs.
        html = html.replace(/(const\s+seasonal\s*=\s*)\[[^\]]*\]/, "$1['winter','autumn','spring']");
        html = html.replace(/(\bseasons\s*=\s*)\[[^\]]*\]/, "$1['winter','autumn','spring']");

        // Keep the Dragonfire crest and sparkles warm, without turquoise accents.
        html = html.replace('</style>', 'body[data-theme="dragon"]{--crestAccent:#ffb347;--spark2:#ffb347}\n</style>');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        status.textContent = 'Die Seite konnte nicht geladen werden. Bitte versuche es später erneut.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
