<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241332">
  <title>Spieler+Berufe | ArcardiaWeb</title>
  <style>
    :root {
      --paper:#f1e5c7;
      --paper-strong:#e7d4a5;
      --ink:#221711;
      --muted:#5d4539;
      --gold:#d9af5b;
      --gold-dark:#9a692b;
      --forest:#2f4f3d;
      --moss:#6b8d5d;
      --ember:#b95a3c;
      --stone:#bca67e;
      --iron:#3a3a39;
      --panel:rgba(248,240,218,.94);
      --shadow:rgba(18,11,9,.22);
      --crest1:#fdf1b4;
      --crest2:#d9af5b;
      --crest3:#7b442d;
      --crestAccent:#7fa36d;
      --spark:#f3d98a;
      --spark2:#b9e1d7;
    }

    body[data-theme="winter"]{--paper:#eaf6ff;--ink:#10243b;--gold:#a9d9f5;--panel:rgba(237,248,255,.95);--forest:#2b5b7d;--moss:#7eb2d6;--ember:#8d4358;--stone:#b9d0de;--crest1:#f3fbff;--crest2:#a9d9f5;--crest3:#335d82;--crestAccent:#7da8ba;--spark:#f2fbff;--spark2:#cfeef7}
    body[data-theme="autumn"]{--paper:#f7efe0;--ink:#382616;--gold:#d4a66d;--panel:rgba(255,246,232,.96);--forest:#5d4b2d;--moss:#a0a45d;--ember:#b14a30;--stone:#d6ae72;--crest1:#fff0d0;--crest2:#d4a66d;--crest3:#7a4a33;--crestAccent:#8c7a45;--spark:#ffe6b0;--spark2:#f5d783}
    body[data-theme="spring"]{--paper:#eff8df;--ink:#25351e;--gold:#a6c76b;--panel:rgba(245,255,231,.95);--forest:#4d744b;--moss:#7fa16d;--ember:#a84949;--stone:#d8d8a4;--crest1:#f7ffd0;--crest2:#a6c76b;--crest3:#4f6b3c;--crestAccent:#83bd71;--spark:#fff1ae;--spark2:#d4f1c6}
    body[data-theme="summer"]{--paper:#fff8df;--ink:#17443d;--gold:#f6c85f;--panel:rgba(255,250,229,.96);--forest:#165d57;--moss:#66a69b;--ember:#c44f45;--stone:#f0d28d;--crest1:#fff5bf;--crest2:#f6c85f;--crest3:#387a67;--crestAccent:#ffb347;--spark:#fff4ad;--spark2:#82dcd2}
    body[data-theme="midnight"]{--paper:#e9e3ff;--ink:#22183b;--gold:#bba7ff;--panel:rgba(239,234,255,.94);--forest:#3a2d5c;--moss:#7d6bbd;--ember:#a33362;--stone:#c5bee4;--crest1:#faf7ff;--crest2:#c3b2ff;--crest3:#4d3a73;--crestAccent:#8d83d7;--spark:#f9e6ff;--spark2:#b5f3ff}
    body[data-theme="desert"]{--paper:#f7e9d0;--ink:#2a170f;--gold:#d8a15d;--panel:rgba(250,238,211,.92);--forest:#5d4232;--moss:#a1794d;--ember:#ac4c35;--stone:#d9b77a;--crest1:#fff0d0;--crest2:#d8a15d;--crest3:#7a4c29;--crestAccent:#b57a3b;--spark:#ffe8a4;--spark2:#f7d0b0}
    body[data-theme="dragon"]{--paper:#ffe6c4;--ink:#371916;--gold:#ff7043;--panel:rgba(255,239,222,.96);--forest:#3d4d32;--moss:#6d9256;--ember:#a52924;--stone:#d7a679;--crest1:#fff0c1;--crest2:#ff7043;--crest3:#6b2825;--crestAccent:#7e9968;--spark:#ffd699;--spark2:#ffb38a}
    body[data-theme="forest"]{--paper:#e7efe0;--ink:#1d2a1b;--gold:#cba55d;--panel:rgba(240,246,234,.96);--forest:#2a4a2d;--moss:#719c69;--ember:#9f4b3a;--stone:#d8c49a;--crest1:#fbf8d7;--crest2:#cba55d;--crest3:#3d5e3b;--crestAccent:#7ea96e;--spark:#f9f0b0;--spark2:#bfe9db}
    body[data-theme="moor"]{--paper:#e5eee4;--ink:#23352e;--gold:#9ab7a3;--panel:rgba(237,245,237,.94);--forest:#315c4b;--moss:#6f9a7d;--ember:#a54b51;--stone:#c0d0b4;--crest1:#edf7ea;--crest2:#9ab7a3;--crest3:#244d43;--crestAccent:#7d9d8d;--spark:#edfdae;--spark2:#d2efe0}

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      font-family:Georgia,"Times New Roman",serif;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.08), transparent 28%),
        linear-gradient(180deg, rgba(20,28,25,.95), rgba(22,17,14,.96));
      transition:background .25s ease, color .25s ease;
    }

    body::before {
      content:"";
      position:fixed;
      inset:0;
      background:
        linear-gradient(rgba(255,255,255,.04), rgba(255,255,255,0)),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,.015) 0,
          rgba(255,255,255,.015) 2px,
          transparent 2px,
          transparent 12px
        );
      pointer-events:none;
      z-index:0;
    }

    header{
      position:relative;
      padding:42px 20px 26px;
      border-bottom:3px solid var(--gold);
      text-align:center;
      overflow:hidden;
      z-index:1;
      background:
        linear-gradient(180deg, rgba(10,14,11,.22), rgba(14,18,14,.4)),
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.1)),
        radial-gradient(circle at top, var(--forest), var(--iron) 74%);
      box-shadow:inset 0 -14px 24px rgba(0,0,0,.18);
    }

    .design-picker{
      position:absolute;
      top:18px;
      right:18px;
      padding:8px 10px;
      border:1px solid var(--gold);
      border-radius:10px;
      background:rgba(21,15,12,.38);
      color:var(--paper);
      z-index:3;
      backdrop-filter:blur(4px);
    }
    .design-picker label{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.72rem;color:var(--paper)}
    .design-picker select{
      background:rgba(255,255,255,.04);
      color:var(--paper);
      border:1px solid rgba(255,255,255,.2);
      border-radius:8px;
      padding:6px 8px;
      margin-left:6px;
      font:inherit;
    }

    .brand{position:relative;z-index:2}
    .crest{width:120px;height:128px;display:block;margin:8px auto 12px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.28));}
    .crest .shield{fill:var(--panel);stroke:var(--crest2);stroke-width:7}
    .crest .shield-edge{fill:none;stroke:var(--crest3);stroke-width:2}
    .crest .inner{fill:none;stroke:var(--crest2);stroke-width:2}
    .crest .pillar{fill:var(--crestAccent);stroke:var(--ink);stroke-width:1.5}
    .crest .lantern{fill:var(--crest1);stroke:var(--ink);stroke-width:2}
    .crest .line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}

    h1{
      margin:6px 0 10px;
      font-size:clamp(2.2rem,6vw,4rem);
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#f7e7be;
      text-shadow:0 3px 0 rgba(0,0,0,.2), 0 10px 18px rgba(0,0,0,.25);
    }
    header p{
      margin:0;
      color:#f0dbab;
      font-size:clamp(1rem,2.3vw,1.45rem);
      font-weight:700;
      letter-spacing:.03em;
    }

    main{max-width:1120px;margin:24px auto;padding:0 18px 18px;position:relative;z-index:2}
    .tabs,.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
    .tabs{border-bottom:2px solid var(--gold);padding-bottom:8px}
    .tabs button{
      padding:12px 16px;
      border:2px solid var(--gold);
      border-bottom:0;
      border-radius:12px 12px 0 0;
      background:rgba(255,255,255,.12);
      color:var(--paper);
      font-weight:700;
      font-family:inherit;
      cursor:pointer;
      transition:transform .2s ease, background .2s ease;
      box-shadow:0 8px 18px rgba(0,0,0,.1);
    }
    .tabs button:hover{transform:translateY(-1px)}
    .tabs button[aria-selected="true"]{
      background:var(--paper);
      color:var(--ink);
      box-shadow:0 -4px 10px rgba(0,0,0,.05);
    }

    input,select{
      flex:1 1 220px;
      padding:12px 14px;
      border:2px solid var(--gold);
      border-radius:10px;
      background:var(--panel);
      color:var(--ink);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
      font:inherit;
    }

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
    .card{
      border:2px solid var(--gold);
      border-radius:14px;
      background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(0,0,0,.02)), var(--panel);
      box-shadow:0 10px 20px var(--shadow), inset 0 0 0 1px rgba(126,92,35,.05);
    }
    .player-card{
      display:flex;
      align-items:center;
      gap:12px;
      width:100%;
      padding:14px 14px 12px;
      color:var(--ink);
      text-align:left;
      cursor:pointer;
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .player-card:hover{transform:translateY(-2px);box-shadow:0 12px 22px rgba(0,0,0,.12)}
    .skin-head{width:62px;height:62px;image-rendering:pixelated;border:2px solid var(--gold);border-radius:8px;background:rgba(0,0,0,.04);}
    .player-card h3{margin:0 0 4px;font-size:1.12rem}
    .player-job{display:block;color:var(--forest);font-weight:700}
    .player-title{display:block;color:var(--gold-dark);font-weight:700;margin-top:5px}

    .job-card{position:relative;padding:16px 18px 18px}
    .job-card h3{margin:0 0 8px;font-size:1.3rem}
    .job-count{margin:0;color:var(--forest);font-weight:700}
    .job-count.full{color:var(--ember)}
    .bar{height:10px;border-radius:999px;background:rgba(126,92,35,.14);overflow:hidden;margin-top:10px;border:1px solid rgba(126,92,35,.15)}
    .bar-fill{height:100%;background:linear-gradient(90deg, var(--forest), var(--moss));border-radius:999px}
    .bar-fill.full{background:linear-gradient(90deg, var(--ember), #cb7c3f)}
    .members{list-style:none;padding:10px 0 0;margin:10px 0 0;border-top:1px solid rgba(126,92,35,.25)}
    .members li{display:flex;align-items:center;gap:8px;margin:8px 0}
    .members img{width:36px;height:36px;border:1px solid var(--gold);border-radius:6px;image-rendering:pixelated;background:rgba(0,0,0,.04)}
    .expand{
      position:absolute;right:12px;bottom:12px;
      width:32px;height:32px;border:1px solid var(--gold);border-radius:50%;
      background:rgba(255,255,255,.15);cursor:pointer;font-size:1.3rem;color:var(--ink);padding:0;
    }
    .region{min-height:100px;padding:18px;border:2px solid var(--gold);border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.02)), var(--panel);color:var(--forest);font-weight:700;font-size:1.15rem;display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.05em;}
    .empty{grid-column:1/-1;text-align:center;color:var(--ink);padding:20px 0;}
    footer{padding:22px 20px 30px;text-align:center;color:#f4de9a;position:relative;z-index:2;letter-spacing:.04em;text-transform:uppercase;font-size:.82rem}

    #weather{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
    .particle{position:absolute;left:var(--x);top:-12vh;color:var(--spark);font-size:var(--size);opacity:0;filter:drop-shadow(0 0 8px currentColor);animation:float var(--time) ease-in-out var(--delay) infinite alternate}
    .particle.sparkle{animation:twinkle var(--time) ease-in-out var(--delay) infinite alternate, drift var(--time) ease-in-out var(--delay) infinite alternate;font-size:var(--size)}
    .particle:nth-child(3n){color:var(--spark2)}
    @keyframes float{0%{transform:translate(0,0) rotate(-12deg) scale(.8);opacity:.2}50%{opacity:.9}100%{transform:translate(var(--dx),var(--dy)) rotate(18deg) scale(1.15);opacity:.45}}
    @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
    @keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}

    dialog{width:min(92vw,540px);border:2px solid var(--gold);border-radius:16px;background:var(--panel);color:var(--ink);box-shadow:0 20px 36px rgba(0,0,0,.2)}
    dialog::backdrop{background:rgba(16,13,28,.65)}
    .profile{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;padding:10px 0 6px}
    .profile img{width:100%;max-height:320px;object-fit:contain;image-rendering:pixelated;border:2px solid var(--gold);border-radius:12px;background:rgba(0,0,0,.04)}
    .close{float:right;padding:8px 10px;background:rgba(255,255,255,.15);border:1px solid var(--gold);border-radius:8px;cursor:pointer;color:var(--ink);font:inherit}
    @media (max-width:520px){.profile{grid-template-columns:1fr}.profile img{max-height:230px}.design-picker{top:8px;right:8px}.tabs button{flex:1 1 auto;padding-inline:12px}} 
  </style>
</head>
<body data-theme="forest">
  <div id="weather" aria-hidden="true"></div>
  <header>
    <div class="design-picker">
      <label for="design">Design </label>
      <select id="design">
        <option value="winter">Winter</option>
        <option value="autumn">Herbst</option>
        <option value="spring">Frühling</option>
        <option value="summer">Sommer</option>
        <option value="midnight">Mitternacht</option>
        <option value="desert">Wüstenabend</option>
        <option value="dragon">Drachenfeuer</option>
        <option value="forest" selected>Wald</option>
        <option value="moor">Nebelmoor</option>
      </select>
    </div>

    <div class="brand">
      <svg class="crest" viewBox="0 0 120 120" role="img" aria-label="Arcardia Wappen">
        <path class="shield" d="M60 8 98 18v38c0 26-16 44-38 54C38 100 22 82 22 56V18z"/>
        <path class="shield-edge" d="M60 11 94 20v34c0 22-14 38-34 48C40 92 26 76 26 54V20z"/>
        <path class="inner" d="M60 22 88 30v27c0 18-11 31-28 40-17-9-28-22-28-40V30z"/>
        <path class="pillar" d="m38 45 22-20 22 20-13-5-9 6-9-6z"/>
        <path class="pillar" d="m45 52 15-12 15 12-10-3-5 4-5-4z"/>
        <path class="line" d="M60 43v42M52 68h16"/>
        <path class="lantern" d="M50 70h20l-7 18H57z"/>
        <path class="line" d="M60 70v18M46 79h28"/>
        <circle cx="60" cy="42" r="4" fill="var(--ink)"/>
      </svg>
      <h1>Spieler+Berufe</h1>
      <p>von ArcardiaWeb • Mittelalterliches Rollenspiel</p>
    </div>
  </header>

  <main>
    <nav class="tabs" role="tablist" aria-label="Arcardia Bereiche">
      <button role="tab" aria-selected="true" aria-controls="playersPanel">Spieler</button>
      <button role="tab" aria-selected="false" aria-controls="jobsPanel">Berufe &amp; freie Plätze</button>
      <button role="tab" aria-selected="false" aria-controls="regionsPanel">Städte &amp; Regionen</button>
    </nav>

    <section id="playersPanel" role="tabpanel">
      <h2>Spielerinnen und Spieler</h2>
      <div class="controls">
        <input id="search" type="search" placeholder="Spieler suchen …" aria-label="Spieler suchen">
        <select id="jobFilter" aria-label="Nach Beruf filtern"><option value="">Alle Berufe</option></select>
      </div>
      <div id="players" class="grid"></div>
    </section>

    <section id="jobsPanel" role="tabpanel" hidden>
      <h2>Berufe &amp; freie Plätze</h2>
      <div class="controls">
        <select id="availability">
          <option value="all">Alle Berufe</option>
          <option value="free">Nur Berufe mit freien Plätzen</option>
          <option value="occupied">Nur belegte/ausgebuchte Berufe</option>
        </select>
      </div>
      <div id="jobs" class="grid"></div>
    </section>

    <section id="regionsPanel" role="tabpanel" hidden>
      <h2>Städte &amp; Regionen</h2>
      <div class="grid">
        <article class="region">Norden</article>
        <article class="region">Westen</article>
        <article class="region">Osten</article>
        <article class="region">Süden</article>
      </div>
    </section>
  </main>

  <dialog id="profileDialog">
    <button class="close" id="closeProfile" type="button">Schließen ✕</button>
    <div class="profile">
      <img id="fullSkin" alt="">
      <div>
        <h2 id="profileName"></h2>
        <p id="profileJobs"></p>
        <p id="profileTitle" class="player-title" hidden></p>
      </div>
    </div>
  </dialog>

  <footer>Spieler+Berufe • ArcardiaWeb</footer>

  <script>
    const limits = { Schmied:5, Marktschreier:5, Magier:5, Bäcker:5, Jäger:5, Bauer:100, Metzger:5, Fischer:100, Ramschladenbesitzer:6, König:1, Königsgarde:3, Wirt:5, Soldat:200, Torwächter:120, Mönch:8, Holzfäller:30, Ritter:25, Minenarbeiter:40, Bogenschütze:25, Rechte Hand des Königs:1 };

    const players = [

    const pe = document.getElementById('players');
    const je = document.getElementById('jobs');

    const availability = document.getElementById('availability');

    roles.forEach(r => {
      const o = document.createElement('option');
      o.value = r; o.textContent = r; jf.appendChild(o);

    function avatar(name, size = 64) {
      return `https://mc-heads.net/avatar/${encodeURIComponent(name)}/${size}`;
    }

    function renderPlayers() {
      const q = search.value.trim().toLowerCase();
      const selected = jf.value;
      pe.replaceChildren();
      const arr = players.filter(p => p.name.toLowerCase().includes(q) && (!selected || p.jobs.includes(selected)));
      if (!arr.length) {
        pe.innerHTML = '<p class="empty">Kein Spieler gefunden.</p>';
        return;
      }
      arr.forEach(p => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'card player-card';
        const im = document.createElement('img'); im.className = 'skin-head'; im.src = avatar(p.name); im.alt = '';
        const info = document.createElement('span');
        const h = document.createElement('h3'); h.textContent = p.name;
        const job = document.createElement('span'); job.className = 'player-job'; job.textContent = 'Berufe: ' + (p.jobs.length ? p.jobs.join(', ') : 'Keine');
        info.append(h, job);
        if (p.title) {
          const t = document.createElement('span'); t.className = 'player-title'; t.textContent = 'Titel: ' + p.title; info.appendChild(t);
        }
        b.append(im, info);
        b.onclick = () => {
          document.getElementById('profileName').textContent = p.name;
          document.getElementById('profileJobs').textContent = 'Berufe: ' + (p.jobs.length ? p.jobs.join(', ') : 'Keine');
          const titleEl = document.getElementById('profileTitle');
          titleEl.textContent = p.title ? 'Titel: ' + p.title : '';
          titleEl.hidden = !p.title;
          const skin = document.getElementById('fullSkin');
          skin.src = `https://mc-heads.net/body/${encodeURIComponent(p.name)}/100`;
          skin.alt = 'Vollständiger Skin von ' + p.name;
          document.getElementById('profileDialog').showModal();
        };
        pe.appendChild(b);
      });
    }

    function renderJobs() {
      je.replaceChildren();
      roles.forEach((r, i) => {
        const max = limits[r];
        const members = players.filter(p => p.jobs.includes(r));
        const n = Math.min(free[r] ?? Math.max(0, max - members.length), max);
        if ((availability.value === 'free' && n === 0) || (availability.value === 'occupied' && n > 0)) return;

        const c = document.createElement('article'); c.className = 'card job-card';
        const h = document.createElement('h3'); h.textContent = r;
        const count = document.createElement('p');
        count.className = 'job-count' + (n === 0 ? ' full' : '');
        count.textContent = n === 0 ? `Ausgebucht (${max}/${max})` : `${n} von ${max} Plätzen frei`;

        const bar = document.createElement('div'); bar.className = 'bar';
        const fill = document.createElement('div'); fill.className = 'bar-fill' + (n === 0 ? ' full' : ''); fill.style.width = Math.min((max - n) / max, 1) * 100 + '%';
        bar.appendChild(fill);

        const list = document.createElement('ul'); list.className = 'members'; list.hidden = true; list.id = 'members-' + i;
        if (!members.length) {
          list.innerHTML = '<li>Keine Spieler eingetragen</li>';
        } else {
          members.forEach(p => {
            const li = document.createElement('li');
            const im = document.createElement('img'); im.src = avatar(p.name, 36); im.alt = '';
            li.append(im, document.createTextNode(p.name));
            list.appendChild(li);
          });
        }

        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'expand'; btn.textContent = '+'; btn.setAttribute('aria-expanded', 'false'); btn.setAttribute('aria-controls', 'members-' + i);
        btn.onclick = () => {
          list.hidden = !list.hidden;
          btn.textContent = list.hidden ? '+' : '−';
          btn.setAttribute('aria-expanded', String(!list.hidden));
        };

        c.append(h, count, bar, list, btn);
        je.appendChild(c);
      });
      if (!je.children.length) je.innerHTML = '<p class="empty">Keine Berufe in dieser Auswahl.</p>';
    }

    search.addEventListener('input', renderPlayers);
    jf.addEventListener('change', renderPlayers);
    availability.addEventListener('change', renderJobs);
    document.getElementById('closeProfile').onclick = () => document.getElementById('profileDialog').close();
    document.getElementById('profileDialog').addEventListener('click', e => { if (e.target.id === 'profileDialog') e.target.close(); });

    document.querySelectorAll('[role="tab"]').forEach((tab, i, all) => {
      tab.onclick = () => {
        all.forEach((t, j) => {
          const selected = i === j;
          t.setAttribute('aria-selected', selected ? 'true' : 'false');
          const panel = document.getElementById(t.getAttribute('aria-controls'));
          if (panel) panel.hidden = !selected;
        });
      };
    });

    const themes = ['winter','autumn','spring','summer','midnight','desert','dragon','forest','moor'];
    const seasonal = ['winter','autumn','spring'];
    const design = document.getElementById('design');
    const weather = document.getElementById('weather');

    function setDesign(t) {
      if (!themes.includes(t)) t = 'forest';
      document.body.dataset.theme = t;
      design.value = t;
      try { localStorage.setItem('arcadia-design', t); } catch {}
      weather.replaceChildren();

      if (seasonal.includes(t)) {
        const map = { winter:'❄', autumn:'❦', spring:'✿' };
        for (let i = 0; i < 24; i++) {
          const p = document.createElement('span');
          p.className = 'particle';
          p.textContent = map[t] || '✦';
          p.style.setProperty('--x', (Math.random() * 100) + '%');
          p.style.setProperty('--size', (10 + Math.random() * 18) + 'px');
          p.style.setProperty('--time', (8 + Math.random() * 12) + 's');
          p.style.setProperty('--delay', (-Math.random() * 18) + 's');
          p.style.setProperty('--dx', (-60 + Math.random() * 120) + 'px');
          p.style.setProperty('--dy', (60 + Math.random() * 100) + 'px');
          weather.appendChild(p);
        }
      } else {
        const glyphs = ['✦','✧','✴','⋆','✦','✧'];
        for (let i = 0; i < 34; i++) {
          const p = document.createElement('span');
          p.className = 'particle sparkle';
          p.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
          p.style.setProperty('--x', (Math.random() * 100) + '%');
          p.style.setProperty('--y', (Math.random() * 94) + '%');
          p.style.setProperty('--size', (10 + Math.random() * 24) + 'px');
          p.style.setProperty('--time', (2.8 + Math.random() * 3.8) + 's');
          p.style.setProperty('--delay', (-Math.random() * 5) + 's');
          p.style.setProperty('--dx', (-90 + Math.random() * 180) + 'px');
          p.style.setProperty('--dy', (-60 + Math.random() * 120) + 'px');
          weather.appendChild(p);
        }
      }
    }

    design.addEventListener('change', () => setDesign(design.value));
    let saved = 'forest';
    try { saved = localStorage.getItem('arcadia-design') || 'forest'; } catch {}
    setDesign(saved);
    renderPlayers();
    renderJobs();
  </script>
</body>
</html>
