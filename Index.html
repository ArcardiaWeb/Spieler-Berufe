<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#241332">
<title>Arcardia – Spieler &amp; Berufe</title>
<style>
:root{--paper:#fff0d2;--ink:#492b24;--gold:#e7a85b;--panel:rgba(255,244,220,.95);--green:#287c78;--red:#a83e32;--sky:#e58f5c;--deep:#56334a;--shade:rgba(58,24,30,.25);--crest1:#ffe7a8;--crest2:#e9a458;--crest3:#a94f3b;--crestAccent:#2e8b83;--spark:#fff1b9;--spark2:#75e4ef}
*{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ink);font-family:Georgia,"Times New Roman",serif;background:linear-gradient(135deg,var(--shade),var(--shade)),radial-gradient(ellipse at top,var(--sky),var(--deep) 72%);transition:background .5s,color .3s}body[data-theme="winter"]{--paper:#eaf6ff;--ink:#10243b;--gold:#a9d9f5;--panel:rgba(237,248,255,.95);--green:#287c9f;--red:#8d4358;--sky:#244f78;--deep:#07182e;--crest1:#f3fbff;--crest2:#a9d9f5;--crest3:#397ba5;--crestAccent:#4a86a8}body[data-theme="autumn"]{--paper:#f7efe0;--ink:#382616;--gold:#d4a66d;--panel:rgba(255,246,232,.96);--green:#7d6f2a;--red:#b14a30;--sky:#d89b4d;--deep:#6b4d2a}body[data-theme="spring"]{--paper:#eff8df;--ink:#25351e;--gold:#a6c76b;--panel:rgba(245,255,231,.95);--green:#54833b;--red:#a84949;--sky:#a6ce7b;--deep:#47704a}body[data-theme="summer"]{--paper:#fff8df;--ink:#17443d;--gold:#f6c85f;--panel:rgba(255,250,229,.96);--green:#27836b;--red:#c44f45;--sky:#23a9bd;--deep:#f3a64c}body[data-theme="midnight"]{--paper:#e9e3ff;--ink:#22183b;--gold:#bba7ff;--panel:rgba(239,234,255,.94);--green:#6742a5;--red:#a33362;--sky:#42366f;--deep:#11152f;--crest1:#faf7ff;--crest2:#bba7ff;--crest3:#6742c0;--crestAccent:#9b7aff;--spark:#fffaff;--spark2:#9e8aff}body[data-theme="dragon"]{--paper:#ffe6c4;--ink:#371916;--gold:#ff7043;--panel:rgba(255,239,222,.96);--green:#47734b;--red:#a52924;--sky:#6b2825;--deep:#180f1c;--crest1:#fff0c1;--crest2:#ff7043;--crest3:#a52924;--crestAccent:#318b83;--spark:#ffd26e;--spark2:#55e0d1}body[data-theme="forest"]{--paper:#e3f0d7;--ink:#1d3024;--gold:#98b878;--panel:rgba(235,246,223,.95);--green:#42774b;--red:#a3463d;--sky:#284d43;--deep:#101e29;--crest1:#e4f0ce;--crest2:#98b878;--crest3:#42774b;--crestAccent:#cfad62;--spark:#e6fac2;--spark2:#94dfae}body[data-theme="moor"]{--paper:#e5eee4;--ink:#23352e;--gold:#99b7a3;--panel:rgba(237,245,237,.94);--green:#477a63;--red:#a54b51;--sky:#3e645d;--deep:#192b35;--crest1:#ecf2df;--crest2:#99b7a3;--crest3:#536e65;--crestAccent:#d2c680;--spark:#f0f3db;--spark2:#a7d8ca}
header{position:relative;padding:38px 20px 26px;color:var(--paper);text-align:center;border-bottom:3px solid var(--gold);overflow:hidden}.design-picker{position:absolute;z-index:2;top:16px;right:18px;padding:8px;border:1px solid var(--gold);border-radius:8px;background:var(--panel);color:var(--ink)}.crest{width:112px;height:112px;display:block;margin:16px auto 10px;filter:drop-shadow(0 5px 8px #0006);overflow:visible}.crest .shield{fill:url(#shieldFill);stroke:var(--ink);stroke-width:3}.crest .inner-shield{fill:var(--panel);stroke:var(--crest3);stroke-width:2}.crest .tower{fill:var(--crestAccent);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.crest .tower-light{fill:var(--crest1);stroke:var(--ink);stroke-width:1.5}.crest .tower-line{stroke:var(--ink);stroke-width:3;stroke-linecap:round}h1{margin:6px;font-size:clamp(2rem,6vw,3rem);letter-spacing:.03em}header p{font-size:clamp(1rem,3vw,1.35rem);font-weight:bold;margin:8px 0 0}.brand{position:relative;z-index:1}.brand::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 27%,color-mix(in srgb,var(--gold) 17%,transparent),transparent 40%);z-index:-1}main{max-width:1050px;margin:22px auto;padding:0 18px;position:relative;z-index:1}.tabs,.controls{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}.tabs{border-bottom:2px solid var(--gold);padding-bottom:8px}.tabs button{padding:11px 16px;border:2px solid var(--gold);border-bottom:0;border-radius:9px 9px 0 0;background:var(--panel);color:var(--ink);font:bold 1rem Georgia,serif;cursor:pointer}.tabs button[aria-selected="true"]{background:var(--paper)}input,main select{flex:1 1 200px;min-width:0;padding:12px;border:2px solid var(--gold);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{border:2px solid var(--gold);border-radius:10px;background:var(--panel);box-shadow:0 5px 15px #0002}.player-card{display:flex;align-items:center;gap:12px;padding:12px;color:var(--ink);text-align:left;cursor:pointer;font:inherit}.skin-head{width:60px;height:60px;image-rendering:pixelated;border:2px solid var(--gold);border-radius:6px}.player-card h3{margin:0 0 5px;overflow-wrap:anywhere}.player-job{color:var(--green);font-weight:bold}.player-title{display:block;color:#9b6b22;font-weight:bold;margin-top:4px}.job-card{position:relative;padding:16px}.job-card h3{margin:0 0 8px}.job-count{margin:0;color:var(--green);font-weight:bold}.job-count.full{color:var(--red)}.bar{height:9px;margin-top:10px;border-radius:12px;background:#d7c8a9;overflow:hidden}.bar-fill{height:100%;background:var(--green)}.bar-fill.full{background:var(--red)}.members{padding:8px 0 0;margin:10px 0 0;border-top:1px solid var(--gold);list-style:none}.members[hidden]{display:none!important}.members li{display:flex;align-items:center;gap:8px;margin:6px 0}.members img{width:36px;height:36px;image-rendering:pixelated;border:1px solid var(--gold);border-radius:4px}.expand{position:absolute;right:10px;bottom:9px;width:34px;height:34px;border:1px solid var(--gold);border-radius:50%;background:var(--paper);color:var(--ink);cursor:pointer}.region{min-height:90px;padding:18px;border:2px solid var(--gold);border-radius:10px;background:var(--panel);color:var(--green);font-weight:bold}.empty{grid-column:1/-1;color:var(--paper);text-align:center}footer{position:relative;z-index:1;padding:20px;text-align:center;color:var(--paper)}#weather{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.particle{position:absolute;left:var(--x);top:-10vh;color:var(--spark);font-size:var(--size);opacity:0;animation:fall var(--time) linear var(--delay) infinite;filter:drop-shadow(0 0 7px currentColor);will-change:transform,opacity}.particle.sparkle{animation-name:twinkle;top:var(--y);left:var(--x);font-size:var(--size)}.particle:nth-child(3n){color:var(--spark2)}.particle:nth-child(4n){font-size:calc(var(--size)*.68)}@keyframes fall{0%{transform:translate(0,-5vh) rotate(0);opacity:0}10%{opacity:.8}90%{opacity:.65}100%{transform:translate(var(--drift),110vh) rotate(360deg);opacity:0}}@keyframes twinkle{0%,100%{transform:scale(.45) rotate(0);opacity:.12}50%{transform:scale(1.05) rotate(45deg);opacity:.85}}dialog{width:min(92vw,540px);border:2px solid var(--gold);border-radius:14px;background:var(--panel);color:var(--ink)}dialog::backdrop{background:#100d1cbb}.profile{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}.profile img{width:100%;max-height:320px;object-fit:contain;image-rendering:pixelated}.close{float:right;padding:8px;background:var(--paper);border:1px solid var(--gold);border-radius:6px;cursor:pointer}@media(max-width:520px){header{padding-top:72px}.design-picker{top:8px;right:8px}.profile{grid-template-columns:1fr}.profile img{max-height:230px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.particle{display:none}}
</style>
</head>
<body data-theme="desert">
<div id="weather" aria-hidden="true"></div>
<header><div class="design-picker"><label for="design">Design </label><select id="design"><option value="winter">Winter</option><option value="autumn">Herbst</option><option value="spring">Frühling</option><option value="summer">Sommer</option><option value="midnight">Mitternacht</option><option value="desert">Wüstenabend</option><option value="dragon">Drachenfeuer</option><option value="forest">Nachtwald</option><option value="moor">Nebelmoor</option></select></div><div class="brand"><svg class="crest" viewBox="0 0 120 130" role="img" aria-label="Arcardia-Wappen"><defs><linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--crest1)"/><stop offset=".52" stop-color="var(--crest2)"/><stop offset="1" stop-color="var(--crest3)"/></linearGradient></defs><path class="shield" d="M60 5 108 19v43c0 31-20 51-48 63C32 113 12 93 12 62V19z"/><path class="inner-shield" d="M60 16 97 27v34c0 24-14 40-37 51C37 101 23 85 23 61V27z"/><path class="tower" d="m35 48 25-22 25 22-12-4-13-10-13 10zM43 56h34l-6 10v29L60 108 49 95V66z"/><path class="tower-light" d="M53 72h14v18l-7 8-7-8z"/><path class="tower-line" d="M60 36v61M48 65h24"/><circle cx="60" cy="42" r="4" fill="var(--crest3)"/></svg><h1>Arcardia</h1><p>Die Bewohner, ihre Berufe und freie Plätze</p></div></header>
<main><nav class="tabs" role="tablist" aria-label="Arcardia Bereiche"><button role="tab" aria-selected="true" aria-controls="playersPanel">Spieler</button><button role="tab" aria-selected="false" aria-controls="jobsPanel">Berufe &amp; freie Plätze</button><button role="tab" aria-selected="false" aria-controls="regionsPanel">Städte &amp; Regionen</button></nav>
<section id="playersPanel" role="tabpanel"><h2>Spielerinnen und Spieler</h2><div class="controls"><input id="search" type="search" placeholder="Spieler suchen …" aria-label="Spieler suchen"><select id="jobFilter" aria-label="Nach Beruf filtern"><option value="">Alle Berufe</option></select></div><div id="players" class="grid"></div></section>
<section id="jobsPanel" role="tabpanel" hidden><h2>Berufe &amp; freie Plätze</h2><div class="controls"><select id="availability"><option value="all">Alle Berufe</option><option value="free">Nur Berufe mit freien Plätzen</option><option value="occupied">Nur belegte/ausgebuchte Berufe</option></select></div><div id="jobs" class="grid"></div></section>
<section id="regionsPanel" role="tabpanel" hidden><h2>Städte &amp; Regionen</h2><div class="grid"><article class="region">Norden</article><article class="region">Westen</article><article class="region">Osten</article><article class="region">Süden</article></div></section></main>
<dialog id="profileDialog"><button class="close" id="closeProfile" type="button">Schließen ✕</button><div class="profile"><img id="fullSkin" alt=""><div><h2 id="profileName"></h2><p id="profileJobs"></p><p id="profileTitle" class="player-title" hidden></p></div></div></dialog><footer>Willkommen in Arcardia – unserem mittelalterlichen Minecraft-Rollenspiel!</footer>
<script>
const limits={Schmied:5,Marktschreier:5,Magier:5,Bäcker:5,Jäger:5,Bauer:100,Metzger:5,Fischer:100,Ramschladenbesitzer:6,König:1,Königsgarde:3,Wirt:5,Soldat:200,Torwächter:20,Minenarbeiter:100,Mönch:20,Ritter:10,Holzfäller:100,"Rechte Hand des Königs":1,Bogenschütze:5};
const free={Schmied:0,Marktschreier:0,Magier:0,Bäcker:0,Jäger:0,Metzger:0,Ramschladenbesitzer:0,König:0,Königsgarde:0,Wirt:0,Torwächter:0,Mönch:0,Holzfäller:0,Ritter:0,Minenarbeiter:16,Bauer:23,Soldat:128,Fischer:38,"Rechte Hand des Königs":0};
const roles=Object.keys(limits),players=[{name:"Fjalraven",jobs:["Magier","Torwächter"]},{name:"DinoNugget1242",jobs:["Minenarbeiter"]},{name:"ItsSamuMC",jobs:["Soldat"]},{name:"C4_Meister",jobs:["Soldat"]},{name:"PaperStraw58602",jobs:["König"],title:"Gründer"},{name:"Mojel11YT",jobs:["Königsgarde"]},{name:"Benzjamin",jobs:["Wirt"]},{name:"PHOENIX XD",jobs:["Soldat"]},{name:"x_simmi",jobs:["Fischer"]},{name:"PriicyRex4038",jobs:["Torwächter"]},{name:"Mapaa5",jobs:["Fischer"]},{name:"AetherXgamers",jobs:["Minenarbeiter"]},{name:"LettLukas",jobs:["Bäcker"]},{name:"Jakobber2000",jobs:["Soldat"]},{name:"xr643",jobs:["Bauer"]},{name:"Caraoelin",jobs:["Bauer"]},{name:"Quirity15",jobs:["Soldat"]},{name:"Delfine4904",jobs:["Bauer"]},{name:"Maax67",jobs:["Mönch"]},{name:"CraftLife12",jobs:["Soldat"]},{name:"zackdieböhn",jobs:["Schmied"]},{name:"Zero",jobs:["Soldat"]},{name:"DiamondDragon",jobs:["Soldat"]},{name:"Sharkalarm",jobs:["Holzfäller"]},{name:"Babbles1042",jobs:["Bauer"]},{name:"RichiHD",jobs:["Bauer"]},{name:"Nao878",jobs:["Soldat"]},{name:"Bluecronik12",jobs:["Bauer"]},{name:"FantasticVici",jobs:["Holzfäller"]},{name:"Zupiruchi",jobs:["Mönch"]},{name:"CaptainBintang",jobs:["Holzfäller"]},{name:"TheFiredoom",jobs:["Minenarbeiter"]},{name:"Akakarivus",jobs:["Ritter"]},{name:"Diefire",jobs:["Ritter"]},{name:"EigeIla",jobs:["Minenarbeiter"]},{name:"N04H_MINECR4FT",jobs:["Fischer"]},{name:"Phoenix90312",jobs:["Soldat"]},{name:"Kenanzockt5814",jobs:["Fischer"]},{name:"LeadedSnow51573",jobs:["Ritter"]},{name:"GamedFio2024",jobs:["Fischer"]},{name:"Gedankebar6029",jobs:["Fischer"]},{name:"truewither",jobs:["Soldat"]},{name:"ScarletJP",jobs:["Soldat"]},{name:"Timmmi1893",jobs:["Minenarbeiter","Soldat"]},{name:"SnowingSun3017",jobs:["Bauer"]},{name:"Zwergnase2111",jobs:["Soldat"]},{name:"Emilcrafty03",jobs:["Mönch"]},{name:"Spilraleel",jobs:["Bäcker"]},{name:"Entonrat12345",jobs:["Holzfäller","Soldat"]},{name:"MaxiF180",jobs:["Soldat","Bäcker"]},{name:"FindusMC",jobs:["Holzfäller"]},{name:"yellowwider822",jobs:["Soldat"]},{name:"NCHTz1",jobs:["Holzfäller"]},{name:"hannes1235090",jobs:["Bauer","Soldat"]},{name:"Rex_Tenebris377",jobs:["Soldat","Holzfäller"]},{name:"DarkKnightVJ",jobs:["Soldat","Holzfäller"]},{name:"BCCaoti",jobs:["Bauer"]},{name:"Kosmosxp",jobs:["Ritter"]},{name:"babbels1042",jobs:["Bauer"]},{name:"darknightIV",jobs:["Bauer","Soldat"]},{name:"kingofrivers343",jobs:["Rechte Hand des Königs"],title:"Gründer"},{name:"sherook",jobs:["Bogenschütze"]},{name:"Letz_No4th",jobs:[],title:"Älterer Königsgardist"}];
const pe=document.getElementById('players'),je=document.getElementById('jobs'),search=document.getElementById('search'),jf=document.getElementById('jobFilter'),availability=document.getElementById('availability');roles.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;jf.append(o)});
function avatar(name,size=64){return `https://mc-heads.net/avatar/${encodeURIComponent(name)}/${size}`}
function renderPlayers(){const q=search.value.trim().toLowerCase(),r=jf.value;pe.replaceChildren();const arr=players.filter(p=>p.name.toLowerCase().includes(q)&&(!r||p.jobs.includes(r)));if(!arr.length){pe.innerHTML='<p class="empty">Kein Spieler gefunden.</p>';return}arr.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='card player-card';const im=document.createElement('img');im.className='skin-head';im.src=avatar(p.name);im.alt='';const info=document.createElement('span'),h=document.createElement('h3'),j=document.createElement('span');h.textContent=p.name;j.className='player-job';j.textContent='Berufe: '+(p.jobs.length?p.jobs.join(', '):'Keine eingetragen');info.append(h,j);if(p.title){const t=document.createElement('span');t.className='player-title';t.textContent='Titel: '+p.title;info.append(t)}b.append(im,info);b.onclick=()=>{document.getElementById('profileName').textContent=p.name;document.getElementById('profileJobs').textContent='Berufe: '+(p.jobs.length?p.jobs.join(', '):'Keine eingetragen');const t=document.getElementById('profileTitle');t.textContent=p.title?'Titel: '+p.title:'';t.hidden=!p.title;const skin=document.getElementById('fullSkin');skin.src=`https://mc-heads.net/body/${encodeURIComponent(p.name)}/100`;skin.alt='Vollständiger Minecraft-Skin von '+p.name;document.getElementById('profileDialog').showModal()};pe.append(b)})}
function renderJobs(){je.replaceChildren();roles.forEach((r,i)=>{const max=limits[r],members=players.filter(p=>p.jobs.includes(r)),n=Math.min(free[r]??Math.max(0,max-members.length),max);if((availability.value==='free'&&n===0)||(availability.value==='occupied'&&n>0))return;const c=document.createElement('article');c.className='card job-card';const h=document.createElement('h3');h.textContent=r;const count=document.createElement('p');count.className='job-count'+(n===0?' full':'');count.textContent=n===0?`Ausgebucht (${max}/${max})`:`${n} von ${max} Plätzen frei`;const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='bar-fill'+(n===0?' full':'');fill.style.width=Math.min((max-n)/max,1)*100+'%';bar.append(fill);const list=document.createElement('ul');list.className='members';list.hidden=true;list.id='members-'+i;members.forEach(p=>{const li=document.createElement('li'),im=document.createElement('img');im.src=avatar(p.name,36);im.alt='';li.append(im,document.createTextNode(p.name));list.append(li)});if(!members.length)list.innerHTML='<li>Keine Spieler eingetragen</li>';const btn=document.createElement('button');btn.className='expand';btn.type='button';btn.textContent='+';btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-controls',list.id);btn.setAttribute('aria-label','Mitglieder von '+r+' anzeigen');btn.onclick=()=>{list.hidden=!list.hidden;btn.textContent=list.hidden?'+':'−';btn.setAttribute('aria-expanded',String(!list.hidden))};c.append(h,count,bar,list,btn);je.append(c)});if(!je.children.length)je.innerHTML='<p class="empty">Keine Berufe in dieser Auswahl.</p>'}
search.addEventListener('input',renderPlayers);jf.addEventListener('change',renderPlayers);availability.addEventListener('change',renderJobs);document.getElementById('closeProfile').onclick=()=>document.getElementById('profileDialog').close();document.getElementById('profileDialog').addEventListener('click',e=>{if(e.target.id==='profileDialog')e.target.close()});document.querySelectorAll('[role="tab"]').forEach((tab,i,all)=>{tab.onclick=()=>all.forEach((t,j)=>{t.setAttribute('aria-selected',String(i===j));document.getElementById(t.getAttribute('aria-controls')).hidden=i!==j})});
const themes=['winter','autumn','spring','summer','midnight','desert','dragon','forest','moor'],seasons=['winter','autumn','spring','summer'],design=document.getElementById('design'),weather=document.getElementById('weather');function setDesign(t){if(!themes.includes(t))t='desert';document.body.dataset.theme=t;design.value=t;try{localStorage.setItem('arcadia-design',t)}catch{}weather.replaceChildren();const seasonalSymbols={winter:'❄',autumn:'🍂',spring:'✿',summer:'✦'};for(let i=0;i<32;i++){const p=document.createElement('span');p.className='particle';if(seasons.includes(t)){p.textContent=seasonalSymbols[t];p.style.cssText=`--x:${Math.random()*100}%;--size:${10+Math.random()*16}px;--time:${8+Math.random()*12}s;--delay:${-Math.random()*18}s;--drift:${-45+Math.random()*90}px`}else{p.classList.add('sparkle');p.textContent=['✦','✧','✴','⋆'][Math.floor(Math.random()*4)];p.style.cssText=`--x:${Math.random()*100}%;--y:${Math.random()*92}%;--size:${10+Math.random()*22}px;--time:${2.2+Math.random()*3}s;--delay:${-Math.random()*5}s`}weather.append(p)}}design.addEventListener('change',()=>setDesign(design.value));let saved='desert';try{saved=localStorage.getItem('arcadia-design')||'desert'}catch{}setDesign(saved);renderPlayers();renderJobs();
</script></body></html>
