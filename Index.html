<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241332">
  <title>Arcardia – Spieler &amp; Berufe</title>
  <style>
    :root {
      --paper:#fff0d2; --ink:#492b24; --gold:#e7a85b; --panel:rgba(255,244,220,.95);
      --green:#287c78; --red:#a83e32; --sky:#e58f5c; --deep:#56334a; --shade:rgba(58,24,30,.25);
      --crest1:#ffe7a8; --crest2:#e9a458; --crest3:#a94f3b; --crestAccent:#2e8b83;
      --spark:#fff2c1; --spark2:#75e4ef;
    }
    body[data-theme="winter"]{--paper:#eaf6ff;--ink:#10243b;--gold:#a9d9f5;--panel:rgba(237,248,255,.95);--green:#287c9f;--red:#8d4358;--sky:#244f78;--deep:#07182e;--crest1:#f3fbff;--crest2:#a9d9f5;--crest3:#397ba5;--crestAccent:#4a86a8;--spark:#fffef5;--spark2:#dfefff}
    body[data-theme="autumn"]{--paper:#f7efe0;--ink:#382616;--gold:#d4a66d;--panel:rgba(255,246,232,.96);--green:#7d6f2a;--red:#b14a30;--sky:#d89b4d;--deep:#6b4d2a}
    body[data-theme="spring"]{--paper:#eff8df;--ink:#25351e;--gold:#a6c76b;--panel:rgba(245,255,231,.95);--green:#54833b;--red:#a84949;--sky:#a6ce7b;--deep:#47704a}
    body[data-theme="summer"]{--paper:#fff8df;--ink:#17443d;--gold:#f6c85f;--panel:rgba(255,250,229,.96);--green:#27836b;--red:#c44f45;--sky:#23a9bd;--deep:#f3a64c;--crestAccent:#ffb347;--spark:#fff3bf;--spark2:#ffb347}
    body[data-theme="midnight"]{--paper:#e9e3ff;--ink:#22183b;--gold:#bba7ff;--panel:rgba(239,234,255,.94);--green:#6742a5;--red:#a33362;--sky:#42366f;--deep:#11152f;--crest1:#faf7ff;--crest2:#bba7ff;--crest3:#6742c0;--crestAccent:#9b7aff;--spark:#fffaff;--spark2:#9e8aff}
    body[data-theme="dragon"]{--paper:#ffe6c4;--ink:#371916;--gold:#ff7043;--panel:rgba(255,239,222,.96);--green:#47734b;--red:#a52924;--sky:#6b2825;--deep:#180f1c;--crest1:#fff0c1;--crest2:#ff7043;--crest3:#a52924;--crestAccent:#ffb347;--spark:#ffd26e;--spark2:#ffb347}
    body[data-theme="forest"]{--paper:#e3f0d7;--ink:#1d3024;--gold:#98b878;--panel:rgba(235,246,223,.95);--green:#42774b;--red:#a3463d;--sky:#284d43;--deep:#101e29;--crest1:#e4f0ce;--crest2:#98b878;--crest3:#42774b;--crestAccent:#cfad62;--spark:#e6fac2;--spark2:#94dfae}
    body[data-theme="moor"]{--paper:#e5eee4;--ink:#23352e;--gold:#99b7a3;--panel:rgba(237,245,237,.94);--green:#477a63;--red:#a54b51;--sky:#3e645d;--deep:#192b35;--crest1:#ecf2df;--crest2:#99b7a3;--crest3:#536e65;--crestAccent:#d2c680;--spark:#f0f3db;--spark2:#a7d8ca}

    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at top,var(--sky),var(--deep) 70%);transition:background .3s ease}
    header{position:relative;padding:42px 20px 24px;border-bottom:3px solid var(--gold);text-align:center;overflow:hidden}
    .design-picker{position:absolute;top:18px;right:18px;padding:8px 10px;border:1px solid var(--gold);border-radius:8px;background:var(--panel);color:var(--ink);z-index:3}
    .brand{position:relative;z-index:2}
    .crest{width:110px;height:118px;display:block;margin:10px auto 8px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
    .crest .shield{fill:var(--panel);stroke:var(--crest2);stroke-width:7}
    .crest .shield-edge{fill:none;stroke:var(--crest3);stroke-width:2}
    .crest .inner{fill:none;stroke:var(--crest2);stroke-width:2}
    .crest .lantern{fill:var(--crest1);stroke:var(--ink);stroke-width:2}
    .crest .pillar{fill:var(--crestAccent);stroke:var(--ink);stroke-width:1.5}
    .crest .line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
    h1{margin:6px 0 8px;font-size:clamp(2.2rem,6vw,3.4rem);letter-spacing:.02em}
    header p{margin:0;font-size:clamp(1rem,2.4vw,1.35rem);font-weight:700}
    main{max-width:1100px;margin:22px auto;padding:0 18px;position:relative;z-index:2}
    .tabs,.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
    .tabs{border-bottom:2px solid var(--gold);padding-bottom:8px}
    .tabs button{padding:12px 16px;border:2px solid var(--gold);border-bottom:0;border-radius:9px 9px 0 0;background:var(--panel);color:var(--ink);font-weight:700;font-family:inherit;cursor:pointer}
    .tabs button[aria-selected="true"]{background:var(--paper)}
    input,select{flex:1 1 200px;padding:12px;border:2px solid var(--gold);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
    .card{border:2px solid var(--gold);border-radius:10px;background:var(--panel);box-shadow:0 5px 16px rgba(0,0,0,.12)}
    .player-card{display:flex;align-items:center;gap:12px;padding:12px;color:var(--ink);text-align:left;cursor:pointer}
    .skin-head{width:60px;height:60px;image-rendering:pixelated;border:2px solid var(--gold);border-radius:6px}
    .player-card h3{margin:0 0 4px;font-size:1.12rem}
    .player-job{display:block;color:var(--green);font-weight:700}
    .player-title{display:block;color:#8b5b1b;font-weight:700;margin-top:4px}
    .job-card{position:relative;padding:16px}
    .job-card h3{margin:0 0 8px}
    .job-count{margin:0;color:var(--green);font-weight:700}
    .job-count.full{color:var(--red)}
    .bar{height:9px;border-radius:12px;background:#d7c8a9;overflow:hidden;margin-top:10px}
    .bar-fill{height:100%;background:var(--green)}
    .bar-fill.full{background:var(--red)}
    .members{list-style:none;padding:8px 0 0;margin:10px 0 0;border-top:1px solid var(--gold)}
    .members li{display:flex;align-items:center;gap:8px;margin:6px 0}
    .members img{width:36px;height:36px;border:1px solid var(--gold);border-radius:4px;image-rendering:pixelated}
    .expand{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border:1px solid var(--gold);border-radius:50%;background:var(--paper);cursor:pointer;font-size:1.2rem}
    .region{min-height:90px;padding:18px;border:2px solid var(--gold);border-radius:10px;background:var(--panel);color:var(--green);font-weight:700}
    .empty{grid-column:1/-1;text-align:center;color:var(--paper);padding:20px 0}
    footer{padding:20px;text-align:center;color:var(--paper);position:relative;z-index:2}

    #weather{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
    .particle{position:absolute;left:var(--x);top:-12vh;color:var(--spark);font-size:var(--size);opacity:0;filter:drop-shadow(0 0 8px currentColor);animation:float var(--time) ease-in-out var(--delay) infinite alternate;will-change:transform,opacity}
    .particle.sparkle{animation:twinkle var(--time) ease-in-out var(--delay) infinite alternate, drift var(--time) ease-in-out var(--delay) infinite alternate;font-size:var(--size)}
    .particle:nth-child(3n){color:var(--spark2)}
    @keyframes float{0%{transform:translate(0,0) rotate(-12deg) scale(.8);opacity:.2}50%{opacity:.85}100%{transform:translate(var(--dx),var(--dy)) rotate(18deg) scale(1.15);opacity:.5}}
    @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
    @keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
    dialog{width:min(92vw,540px);border:2px solid var(--gold);border-radius:14px;background:var(--panel);color:var(--ink)}
    dialog::backdrop{background:rgba(16,13,28,.65)}
    .profile{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
    .profile img{width:100%;max-height:320px;object-fit:contain;image-rendering:pixelated}
    .close{float:right;padding:8px;background:var(--paper);border:1px solid var(--gold);border-radius:6px;cursor:pointer}
    @media (max-width:520px){.profile{grid-template-columns:1fr}.profile img{max-height:230px}.design-picker{top:8px;right:8px}}
  </style>
</head>
<body data-theme="desert">
  <div id="weather" aria-hidden="true"></div>
  <header>
    <div class="design-picker">
      <label for="design">Design </label>
      <select id="design">
        <option value="winter">Winter</option>
        <option value="autumn">Herbst</option>
        <option value="spring">Frühling</option>
        <option value="summer">Sommer</option>
        <option value="midnight">Mitternacht</option>
        <option value="desert" selected>Wüstenabend</option>
        <option value="dragon">Drachenfeuer</option>
        <option value="forest">Nachtwald</option>
        <option value="moor">Nebelmoor</option>
      </select>
    </div>

    <div class="brand">
      <svg class="crest" viewBox="0 0 120 120" role="img" aria-label="Arcardia Wappen">
        <path class="shield" d="M60 8 98 18v38c0 26-16 44-38 54C38 100 22 82 22 56V18z"/>
        <path class="shield-edge" d="M60 11 94 20v34c0 22-14 38-34 48C40 92 26 76 26 54V20z"/>
        <path class="inner" d="M60 22 88 30v27c0 18-11 31-28 40-17-9-28-22-28-40V30z"/>
        <path class="pillar" d="m38 45 22-20 22 20-13-5-9 6-9-6z"/>
        <path class="pillar" d="m45 52 15-12 15 12-10-3-5 4-5-4z"/>
        <path class="line" d="M60 43v42M52 68h16"/>
        <path class="lantern" d="M50 70h20l-7 18H57z"/>
        <path class="line" d="M60 70v18M46 79h28"/>
        <circle cx="60" cy="42" r="4" fill="var(--ink)"/>
      </svg>
      <h1>Arcardia</h1>
      <p>Die Bewohner, ihre Berufe und freie Plätze</p>
    </div>
  </header>

  <main>
    <nav class="tabs" role="tablist" aria-label="Arcardia Bereiche">
      <button role="tab" aria-selected="true" aria-controls="playersPanel">Spieler</button>
      <button role="tab" aria-selected="false" aria-controls="jobsPanel">Berufe &amp; freie Plätze</button>
      <button role="tab" aria-selected="false" aria-controls="regionsPanel">Städte &amp; Regionen</button>
    </nav>

    <section id="playersPanel" role="tabpanel">
      <h2>Spielerinnen und Spieler</h2>
      <div class="controls">
        <input id="search" type="search" placeholder="Spieler suchen …" aria-label="Spieler suchen">
        <select id="jobFilter" aria-label="Nach Beruf filtern"><option value="">Alle Berufe</option></select>
      </div>
      <div id="players" class="grid"></div>
    </section>

    <section id="jobsPanel" role="tabpanel" hidden>
      <h2>Berufe &amp; freie Plätze</h2>
      <div class="controls">
        <select id="availability">
          <option value="all">Alle Berufe</option>
          <option value="free">Nur Berufe mit freien Plätzen</option>
          <option value="occupied">Nur belegte/ausgebuchte Berufe</option>
        </select>
      </div>
      <div id="jobs" class="grid"></div>
    </section>

    <section id="regionsPanel" role="tabpanel" hidden>
      <h2>Städte &amp; Regionen</h2>
      <div class="grid">
        <article class="region">Norden</article>
        <article class="region">Westen</article>
        <article class="region">Osten</article>
        <article class="region">Süden</article>
      </div>
    </section>
  </main>

  <dialog id="profileDialog">
    <button class="close" id="closeProfile" type="button">Schließen ✕</button>
    <div class="profile">
      <img id="fullSkin" alt="">
      <div>
        <h2 id="profileName"></h2>
        <p id="profileJobs"></p>
        <p id="profileTitle" class="player-title" hidden></p>
      </div>
    </div>
  </dialog>

  <footer>Willkommen in Arcardia – unserem mittelalterlichen Minecraft-Rollenspiel!</footer>

  <script>
    const limits = { Schmied:5, Marktschreier:5, Magier:5, Bäcker:5, Jäger:5, Bauer:100, Metzger:5, Fischer:100, Ramschladenbesitzer:6, König:1, Königsgarde:3, Wirt:5, Soldat:200, Torwächter:20, Minenarbeiter:100, Mönch:20, Ritter:10, Holzfäller:100, "Rechte Hand des Königs":1, Bogenschütze:5 };
    const free = { Schmied:0, Marktschreier:0, Magier:0, Bäcker:0, Jäger:0, Metzger:0, Ramschladenbesitzer:0, König:0, Königsgarde:0, Wirt:0, Torwächter:0, Mönch:0, Holzfäller:0, Ritter:0, Minenarbeiter:16, Bauer:23, Soldat:128, Fischer:38, "Rechte Hand des Königs":0 };
    const roles = Object.keys(limits);
    const players = [
      { name:"Fjalraven", jobs:["Magier","Torwächter"] },
      { name:"DinoNugget1242", jobs:["Minenarbeiter"] },
      { name:"ItsSamuMC", jobs:["Soldat"] },
      { name:"C4_Meister", jobs:["Soldat"] },
      { name:"PaperStraw58602", jobs:["König"] },
      { name:"Mojel11YT", jobs:["Königsgarde"] },
      { name:"Benzjamin", jobs:["Wirt"] },
      { name:"PHOENIX XD", jobs:["Soldat"] },
      { name:"x_simmi", jobs:["Fischer"] },
      { name:"PriicyRex4038", jobs:["Torwächter"] },
      { name:"Mapaa5", jobs:["Fischer"] },
      { name:"AetherXgamers", jobs:["Minenarbeiter"] },
      { name:"LettLukas", jobs:["Bäcker"] },
      { name:"Jakobber2000", jobs:["Soldat"] },
      { name:"xr643", jobs:["Bauer"] },
      { name:"Caraoelin", jobs:["Bauer"] },
      { name:"Quirity15", jobs:["Soldat"] },
      { name:"Delfine4904", jobs:["Bauer"] },
      { name:"Maax67", jobs:["Mönch"] },
      { name:"CraftLife12", jobs:["Soldat"] },
      { name:"zackdieböhn", jobs:["Schmied"] },
      { name:"Zero", jobs:["Soldat"] },
      { name:"DiamondDragon", jobs:["Soldat"] },
      { name:"Sharkalarm", jobs:["Holzfäller"] },
      { name:"Babbles1042", jobs:["Bauer"] },
      { name:"RichiHD", jobs:["Bauer"] },
      { name:"Nao878", jobs:["Soldat"] },
      { name:"Bluecronik12", jobs:["Bauer"] },
      { name:"FantasticVici", jobs:["Holzfäller"] },
      { name:"Zupiruchi", jobs:["Mönch"] },
      { name:"CaptainBintang", jobs:["Holzfäller"] },
      { name:"TheFiredoom", jobs:["Minenarbeiter"] },
      { name:"Akakarivus", jobs:["Ritter"] },
      { name:"Diefire", jobs:["Ritter"] },
      { name:"EigeIla", jobs:["Minenarbeiter"] },
      { name:"N04H_MINECR4FT", jobs:["Fischer"] },
      { name:"Phoenix90312", jobs:["Soldat"] },
      { name:"Kenanzockt5814", jobs:["Fischer"] },
      { name:"LeadedSnow51573", jobs:["Ritter"] },
      { name:"GamedFio2024", jobs:["Fischer"] },
      { name:"Gedankebar6029", jobs:["Fischer"] },
      { name:"truewither", jobs:["Soldat"] },
      { name:"ScarletJP", jobs:["Soldat"] },
      { name:"Timmmi1893", jobs:["Minenarbeiter","Soldat"] },
      { name:"SnowingSun3017", jobs:["Bauer"] },
      { name:"Zwergnase2111", jobs:["Soldat"] },
      { name:"Emilcrafty03", jobs:["Mönch"] },
      { name:"Spilraleel", jobs:["Bäcker"] },
      { name:"Entonrat12345", jobs:["Holzfäller","Soldat"] },
      { name:"MaxiF180", jobs:["Soldat","Bäcker"] },
      { name:"FindusMC", jobs:["Holzfäller"] },
      { name:"yellowwider822", jobs:["Soldat"] },
      { name:"NCHTz1", jobs:["Holzfäller"] },
      { name:"hannes1235090", jobs:["Bauer","Soldat"] },
      { name:"Rex_Tenebris377", jobs:["Soldat","Holzfäller"] },
      { name:"DarkKnightVJ", jobs:["Soldat","Holzfäller"] },
      { name:"BCCaoti", jobs:["Bauer"] },
      { name:"Kosmosxp", jobs:["Ritter"] },
      { name:"babbels1042", jobs:["Bauer"] },
      { name:"darknightIV", jobs:["Bauer","Soldat"] },
      { name:"kingofrivers343", jobs:["Rechte Hand des Königs"], title:"Gründer" },
      { name:"sherook", jobs:["Bogenschütze"] },
      { name:"Letz_No4th", jobs:[], title:"Älterer Königsgardist" }
    ];

    const pe = document.getElementById('players');
    const je = document.getElementById('jobs');
    const search = document.getElementById('search');
    const jf = document.getElementById('jobFilter');
    const availability = document.getElementById('availability');

    roles.forEach(r => {
      const o = document.createElement('option');
      o.value = r; o.textContent = r; jf.appendChild(o);
    });

    function avatar(name, size = 64) {
      return `https://mc-heads.net/avatar/${encodeURIComponent(name)}/${size}`;
    }

    function renderPlayers() {
      const q = search.value.trim().toLowerCase();
      const selected = jf.value;
      pe.replaceChildren();
      const arr = players.filter(p => p.name.toLowerCase().includes(q) && (!selected || p.jobs.includes(selected)));
      if (!arr.length) {
        pe.innerHTML = '<p class="empty">Kein Spieler gefunden.</p>';
        return;
      }
      arr.forEach(p => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'card player-card';
        const im = document.createElement('img'); im.className = 'skin-head'; im.src = avatar(p.name); im.alt = '';
        const info = document.createElement('span');
        const h = document.createElement('h3'); h.textContent = p.name;
        const job = document.createElement('span'); job.className = 'player-job'; job.textContent = 'Berufe: ' + (p.jobs.length ? p.jobs.join(', ') : 'Keine');
        info.append(h, job);
        if (p.title) {
          const t = document.createElement('span'); t.className = 'player-title'; t.textContent = 'Titel: ' + p.title; info.appendChild(t);
        }
        b.append(im, info);
        b.onclick = () => {
          document.getElementById('profileName').textContent = p.name;
          document.getElementById('profileJobs').textContent = 'Berufe: ' + (p.jobs.length ? p.jobs.join(', ') : 'Keine');
          const titleEl = document.getElementById('profileTitle');
          titleEl.textContent = p.title ? 'Titel: ' + p.title : '';
          titleEl.hidden = !p.title;
          const skin = document.getElementById('fullSkin');
          skin.src = `https://mc-heads.net/body/${encodeURIComponent(p.name)}/100`;
          skin.alt = 'Vollständiger Skin von ' + p.name;
          document.getElementById('profileDialog').showModal();
        };
        pe.appendChild(b);
      });
    }

    function renderJobs() {
      je.replaceChildren();
      roles.forEach((r, i) => {
        const max = limits[r];
        const members = players.filter(p => p.jobs.includes(r));
        const n = Math.min(free[r] ?? Math.max(0, max - members.length), max);
        if ((availability.value === 'free' && n === 0) || (availability.value === 'occupied' && n > 0)) return;

        const c = document.createElement('article'); c.className = 'card job-card';
        const h = document.createElement('h3'); h.textContent = r;
        const count = document.createElement('p');
        count.className = 'job-count' + (n === 0 ? ' full' : '');
        count.textContent = n === 0 ? `Ausgebucht (${max}/${max})` : `${n} von ${max} Plätzen frei`;

        const bar = document.createElement('div'); bar.className = 'bar';
        const fill = document.createElement('div'); fill.className = 'bar-fill' + (n === 0 ? ' full' : ''); fill.style.width = Math.min((max - n) / max, 1) * 100 + '%';
        bar.appendChild(fill);

        const list = document.createElement('ul'); list.className = 'members'; list.hidden = true; list.id = 'members-' + i;
        if (!members.length) {
          list.innerHTML = '<li>Keine Spieler eingetragen</li>';
        } else {
          members.forEach(p => {
            const li = document.createElement('li');
            const im = document.createElement('img'); im.src = avatar(p.name, 36); im.alt = '';
            li.append(im, document.createTextNode(p.name));
            list.appendChild(li);
          });
        }

        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'expand'; btn.textContent = '+'; btn.setAttribute('aria-expanded', 'false'); btn.setAttribute('aria-controls', list.id);
        btn.onclick = () => {
          list.hidden = !list.hidden;
          btn.textContent = list.hidden ? '+' : '−';
          btn.setAttribute('aria-expanded', String(!list.hidden));
        };

        c.append(h, count, bar, list, btn);
        je.appendChild(c);
      });
      if (!je.children.length) je.innerHTML = '<p class="empty">Keine Berufe in dieser Auswahl.</p>';
    }

    search.addEventListener('input', renderPlayers);
    jf.addEventListener('change', renderPlayers);
    availability.addEventListener('change', renderJobs);
    document.getElementById('closeProfile').onclick = () => document.getElementById('profileDialog').close();
    document.getElementById('profileDialog').addEventListener('click', e => { if (e.target.id === 'profileDialog') e.target.close(); });

    document.querySelectorAll('[role="tab"]').forEach((tab, i, all) => {
      tab.onclick = () => {
        all.forEach((t, j) => {
          const selected = i === j;
          t.setAttribute('aria-selected', selected ? 'true' : 'false');
          const panel = document.getElementById(t.getAttribute('aria-controls'));
          if (panel) panel.hidden = !selected;
        });
      };
    });

    const themes = ['winter','autumn','spring','summer','midnight','desert','dragon','forest','moor'];
    const seasonal = ['winter','autumn','spring'];
    const design = document.getElementById('design');
    const weather = document.getElementById('weather');

    function setDesign(t) {
      if (!themes.includes(t)) t = 'desert';
      document.body.dataset.theme = t;
      design.value = t;
      try { localStorage.setItem('arcadia-design', t); } catch {}
      weather.replaceChildren();

      if (seasonal.includes(t)) {
        const map = { winter:'❄', autumn:'❦', spring:'✿' };
        for (let i = 0; i < 24; i++) {
          const p = document.createElement('span');
          p.className = 'particle';
          p.textContent = map[t] || '✦';
          p.style.setProperty('--x', (Math.random() * 100) + '%');
          p.style.setProperty('--size', (10 + Math.random() * 18) + 'px');
          p.style.setProperty('--time', (8 + Math.random() * 12) + 's');
          p.style.setProperty('--delay', (-Math.random() * 18) + 's');
          p.style.setProperty('--dx', (-60 + Math.random() * 120) + 'px');
          p.style.setProperty('--dy', (60 + Math.random() * 100) + 'px');
          weather.appendChild(p);
        }
      } else {
        const glyphs = ['✦','✧','✴','⋆','✦','✧'];
        for (let i = 0; i < 34; i++) {
          const p = document.createElement('span');
          p.className = 'particle sparkle';
          p.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
          p.style.setProperty('--x', (Math.random() * 100) + '%');
          p.style.setProperty('--y', (Math.random() * 94) + '%');
          p.style.setProperty('--size', (10 + Math.random() * 24) + 'px');
          p.style.setProperty('--time', (2.8 + Math.random() * 3.8) + 's');
          p.style.setProperty('--delay', (-Math.random() * 5) + 's');
          p.style.setProperty('--dx', (-90 + Math.random() * 180) + 'px');
          p.style.setProperty('--dy', (-60 + Math.random() * 120) + 'px');
          weather.appendChild(p);
        }
      }
    }

    design.addEventListener('change', () => setDesign(design.value));
    let saved = 'desert';
    try { saved = localStorage.getItem('arcadia-design') || 'desert'; } catch {}
    setDesign(saved);
    renderPlayers();
    renderJobs();
  </script>
</body>
</html>
